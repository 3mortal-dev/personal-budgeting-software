<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- ═══════════════════════════ SIDEBAR ═══════════════════════════ -->
<aside class="sidebar" th:fragment="sidebar (activePage)">
    <div class="sidebar__logo">
        <div class="sidebar__logo-icon"><i class="fa-solid fa-wallet"></i></div>
        <span class="sidebar__logo-text">BudgetWise</span>
    </div>
    <nav class="sidebar__nav">
        <a class="sidebar__link" th:classappend="${activePage == 'dashboard'} ? 'sidebar__link--active'" th:href="@{/dashboard}" href="/dashboard">
            <i class="fa-solid fa-house"></i><span>Home</span>
        </a>
        <a class="sidebar__link" th:classappend="${activePage == 'transactions'} ? 'sidebar__link--active'" th:href="@{/transactions}" href="/transactions">
            <i class="fa-solid fa-receipt"></i><span>Transactions</span>
        </a>
        <a class="sidebar__link" th:classappend="${activePage == 'budget'} ? 'sidebar__link--active'" th:href="@{/budget}" href="/budget">
            <i class="fa-solid fa-chart-pie"></i><span>Budgets</span>
        </a>
        <a class="sidebar__link" th:classappend="${activePage == 'goals'} ? 'sidebar__link--active'" th:href="@{/goals}" href="/goals">
            <i class="fa-solid fa-bullseye"></i><span>Goals</span>
        </a>
        <a class="sidebar__link" th:classappend="${activePage == 'reports'} ? 'sidebar__link--active'" th:href="@{/reports}" href="/reports">
            <i class="fa-solid fa-chart-bar"></i><span>Reports</span>
        </a>
        <a class="sidebar__link" th:classappend="${activePage == 'notifications'} ? 'sidebar__link--active'" th:href="@{/notifications}" href="/notifications">
            <i class="fa-solid fa-bell"></i><span>Notifications</span>
        </a>
        <a class="sidebar__link" th:classappend="${activePage == 'profile'} ? 'sidebar__link--active'" th:href="@{/userProfile}" href="/userProfile">
            <i class="fa-solid fa-user"></i><span>Profile</span>
        </a>
        <a class="sidebar__link" th:classappend="${activePage == 'admin'} ? 'sidebar__link--active'" th:href="@{/admin}" href="/admin"
           sec:authorize="hasRole('ADMIN')">
            <i class="fa-solid fa-shield-halved"></i><span>Admin</span>
        </a>
    </nav>
    <form class="sidebar__logout-form" th:action="@{/api/auth/logout}" method="post">
        <button type="submit" class="sidebar__logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span>
        </button>
    </form>
</aside>
</body>
</html>
