<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BudgetWise – Log In</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/theme.css}" href="../static/css/theme.css" />
  <link rel="stylesheet" th:href="@{/css/background.css}" href="../static/css/background.css" />
  <link rel="stylesheet" th:href="@{/css/login.css}" href="../static/css/login.css" />
  <script>
    (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}})();
  </script>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>
<div class="auth-card">
  <div class="auth-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"/>
      <path d="M2 10h20"/>
    </svg>
    BudgetWise
  </div>

  <div class="auth-header">
    <h1>Welcome back</h1>
    <p>Sign in to your account</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <div class="field-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M2 7l10 7 10-7"/>
        </svg>
        <input type="email" id="email" name="email" placeholder="ahmed@example.com" autocomplete="email" />
      </div>
      <span class="field-error" id="emailError"></span>
    </div>

    <div class="field">
      <div class="label-row">
        <label for="password">Password</label>
        <a href="#" class="forgot-link" tabindex="-1">Forgot?</a>
      </div>
      <div class="field-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <span class="field-error" id="passwordError"></span>
    </div>

    <button type="submit" class="btn-auth" id="submitBtn">
      <span class="btn-text">Log In</span>
      <span class="btn-spinner"></span>
    </button>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="/register">Sign Up</a>
  </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
