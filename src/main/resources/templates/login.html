<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BudgetWise – Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/login.css}"  href="/css/login.css"/>
</head>
<body>
  <div class="page-bg">
    <div class="card">

      <!-- ── LEFT PANEL ── -->
      <aside class="panel-left">
        <!-- Logo -->
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <path d="M2 10h20"/>
            </svg>
          </div>
          <span>BudgetWise</span>
        </div>

        <!-- Headline -->
        <div class="panel-copy">
          <h1>Take control of your finances</h1>
          <p>Manage your income, expenses and savings in one place with simple tools designed for you.</p>
        </div>

        <!-- Decorative blobs -->
        <div class="blob blob-tl"></div>
        <div class="blob blob-br"></div>

        <!-- Slide dots -->
        <div class="dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </aside>

      <!-- ── RIGHT PANEL ── -->
      <main class="panel-right">
        <div class="form-wrapper">
          <div class="form-header">
            <h2>Welcome back</h2>
            <p>Enter your details to access your dashboard</p>
          </div>

          <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="field-group">
              <label for="email">Email Address</label>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                       stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M2 7l10 7 10-7"/>
                  </svg>
                </span>
                <input type="email" id="email" name="email"
                       placeholder="ahmed@example.com" autocomplete="email" />
              </div>
              <span class="field-error" id="emailError"></span>
            </div>

            <!-- Password -->
            <div class="field-group">
              <div class="label-row">
                <label for="password">Password</label>
                <a href="#" class="forgot-link" tabindex="-1">Forgot password?</a>
              </div>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                       stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" autocomplete="current-password" />
                <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
                  <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
              <span class="field-error" id="passwordError"></span>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-login" id="submitBtn">
              <span class="btn-text">Log In</span>
              <span class="btn-arrow">→</span>
              <span class="btn-spinner hidden"></span>
            </button>
          </form>

          <p class="signup-prompt">
            Don't have an account?
            <a href="/register" class="signup-link">Sign Up</a>
          </p>
        </div>
      </main>
    </div>
  </div>

  <script th:src="@{/js/login.js}"></script>
</body>
</html>
