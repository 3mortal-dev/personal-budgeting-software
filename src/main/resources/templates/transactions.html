<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BudgetWise – Transactions</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/transactions.css}"
          href="../static/css/transactions.css"/>
</head>
<body>

<div class="layout">

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar">
        <a th:href="@{/dashboard}" href="dashboard.html" class="logo">
            <div class="logo-icon">
                <i class="fas fa-wallet"></i>
            </div>
            <span class="logo-text">BudgetWise</span>
        </a>

        <nav class="nav">
            <a th:href="@{/dashboard}" href="dashboard.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                Dashboard
            </a>
            <a th:href="@{/transactions}" href="transactions.html" class="nav-item">
                <i class="fas fa-list"></i>
                Transactions
            </a>
            <a th:href="@{/budget}" href="budget.html" class="nav-item">
                <i class="fas fa-chart-pie"></i>
                Budgets
            </a>
            <a th:href="@{/goals}" href="goals.html" class="nav-item">
                <i class="fas fa-bullseye"></i>
                Goals
            </a>
            <a th:href="@{/reports}" href="reports.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                Reports
            </a>
            <a th:href="@{/notifications}" href="notifications.html" class="nav-item">
                <i class="fas fa-bell"></i>
                Notifications
            </a>
            <a th:href="@{/userProfile}" href="userProfile.html" class="nav-item">
                <i class="fas fa-user"></i>
                Profile
            </a>
        </nav>

        <div class="logout">
            <div class="nav-item" onclick="window.location='index.html'">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </div>
        </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <div class="main">

        <!-- TOP NAV -->
        <div class="topnav">
            <div class="topnav-greeting" id="greeting">
                Welcome <span>👋</span>
            </div>
            <div class="topnav-actions">
                <div class="notif-wrapper" id="notifWrapper">
                    <button class="btn-icon notif-btn" id="notifBtn"
                            onclick="toggleNotifications()" aria-label="Notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notif-badge" id="notifBadge"></span>
                    </button>

                    <!-- Notification Dropdown -->
                    <div class="notif-dropdown" id="notifDropdown">
                        <div class="notif-dropdown-header">
                            <span class="notif-dropdown-title">Notifications</span>
                            <button class="notif-mark-all" onclick="markAllRead()">Mark
                                all read
                            </button>
                        </div>
                        <div class="notif-list" id="notifList"></div>
                        <div class="notif-dropdown-footer">
                            <a href="notifications.html" class="notif-view-all">View all
                                notifications</a>
                        </div>
                    </div>
                </div>
                <div class="avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <!-- Page Header -->
            <div class="page-header">
                <div>
                    <h1>Transactions</h1>
                    <p>Track your income and expenses.</p>
                </div>
                <button class="btn-primary" onclick="showAddTransactionModal()">
                    <i class="fas fa-plus"></i>
                    Add Transaction
                </button>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label for="typeFilter">Type:</label>
                    <select id="typeFilter" onchange="filterTransactions()">
                        <option value="all">All</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="categoryFilter">Category:</label>
                    <select id="categoryFilter" onchange="filterTransactions()">
                        <option value="all">All Categories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="dateFrom">From:</label>
                    <input type="date" id="dateFrom" onchange="filterTransactions()">
                </div>
                <div class="filter-group">
                    <label for="dateTo">To:</label>
                    <input type="date" id="dateTo" onchange="filterTransactions()">
                </div>
            </div>

            <!-- Transactions Table -->
            <div class="transactions-container">
                <table class="transactions-table">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Source</th>
                        <th>Amount</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="transactionsTableBody">
                    <!-- Transactions will be loaded here -->
                    </tbody>
                </table>
            </div>

        </div>

    </div>

</div>

<!-- Add Transaction Modal -->
<div id="addTransactionModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add Transaction</h2>
            <button class="modal-close"
                    onclick="closeAddTransactionModal()">&times;
            </button>
        </div>
        <form id="addTransactionForm" onsubmit="addTransaction(event)">
            <div class="form-group">
                <label for="transactionType">Type *</label>
                <select id="transactionType" required>
                    <option value="INCOME">Income</option>
                    <option value="EXPENSE">Expense</option>
                </select>
            </div>
            <div class="form-group">
                <label for="transactionAmount">Amount *</label>
                <input type="number" id="transactionAmount" step="0.01" min="0.01"
                       required>
            </div>
            <div class="form-group">
                <label for="transactionDate">Date *</label>
                <input type="date" id="transactionDate" required>
            </div>
            <div class="form-group">
                <label for="transactionCategory">Category *</label>
                <select id="transactionCategory" required>
                    <!-- Categories will be loaded here -->
                </select>
            </div>
            <div class="form-group">
                <label for="transactionSource">Source</label>
                <input type="text" id="transactionSource">
            </div>
            <div class="form-group">
                <label for="transactionDescription">Description</label>
                <textarea id="transactionDescription" rows="3"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-secondary"
                        onclick="closeAddTransactionModal()">Cancel
                </button>
                <button type="submit" class="btn-primary">Add Transaction</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Transaction Modal -->
<div id="editTransactionModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Transaction</h2>
            <button class="modal-close"
                    onclick="closeEditTransactionModal()">&times;
            </button>
        </div>
        <form id="editTransactionForm" onsubmit="updateTransaction(event)">
            <input type="hidden" id="editTransactionId">
            <div class="form-group">
                <label for="editTransactionType">Type *</label>
                <select id="editTransactionType" required>
                    <option value="INCOME">Income</option>
                    <option value="EXPENSE">Expense</option>
                </select>
            </div>
            <div class="form-group">
                <label for="editTransactionAmount">Amount *</label>
                <input type="number" id="editTransactionAmount" step="0.01"
                       min="0.01" required>
            </div>
            <div class="form-group">
                <label for="editTransactionDate">Date *</label>
                <input type="date" id="editTransactionDate" required>
            </div>
            <div class="form-group">
                <label for="editTransactionCategory">Category *</label>
                <select id="editTransactionCategory" required>
                    <!-- Categories will be loaded here -->
                </select>
            </div>
            <div class="form-group">
                <label for="editTransactionSource">Source</label>
                <input type="text" id="editTransactionSource">
            </div>
            <div class="form-group">
                <label for="editTransactionDescription">Description</label>
                <textarea id="editTransactionDescription" rows="3"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-secondary"
                        onclick="closeEditTransactionModal()">Cancel
                </button>
                <button type="submit" class="btn-primary">Update
                    Transaction
                </button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/transactions.js}" src="../static/js/transactions.js"></script>
</body>
</html>
