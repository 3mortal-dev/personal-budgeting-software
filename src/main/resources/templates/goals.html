<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('goals', ~{:: head}, ~{:: page-body})}">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BudgetWise – Goals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/loading.css}" href="../static/css/loading.css"/>
    <link rel="stylesheet" th:href="@{/css/goals.css}" href="../static/css/goals.css"/>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" href="../static/css/sidebar.css"/>
    <link rel="stylesheet" th:href="@{/css/main-column.css}" href="../static/css/main-column.css"/>
    <link rel="stylesheet" th:href="@{/css/topbar.css}" href="../static/css/topbar.css"/>
</head>
<body>
<th:block th:fragment="page-body">

<!-- ══ PAGE LOADER ══ -->
<div class="page-loader" id="pageLoader">
    <div class="page-loader__logo">
        <div class="page-loader__icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="2"/>
                <path d="M2 10h20"/>
            </svg>
        </div>
        BudgetWise
    </div>
    <div class="page-loader__bar-track">
        <div class="page-loader__bar-fill" id="loaderBar"></div>
    </div>
    <div class="page-loader__label" id="loaderLabel">Loading your goals…</div>
</div>

<!-- Floating background particles -->
<div class="bg-particles" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>

<!-- ═══════════════════════════ MAIN ═══════════════════════════ -->
<main class="main">

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="topbar__greeting">
            Good morning, <span id="topbarUsername" th:text="${username}" class="topbar__name">User</span> 👋
        </div>
        <div class="topbar__actions">
            <div class="topbar__search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search…" id="searchInput"/>
            </div>

            <!-- Notification Bell -->
            <div class="notif-wrap">
                <button id="bellBtn" class="topbar__notif" aria-label="Notifications">
                    <i class="fa-regular fa-bell"></i>
                    <span id="notifBadge" class="topbar__notif-badge" style="display:none">0</span>
                </button>
                <div id="notifDropdown" class="notif-dropdown">
                    <div class="notif-header">
                        <span class="notif-title">Notifications</span>
                        <button id="markAllReadBtn" class="notif-mark-all">Mark all read</button>
                    </div>
                    <div class="notif-tabs">
                        <button class="notif-tab active" data-tab="all">All</button>
                        <button class="notif-tab" data-tab="unread">Unread</button>
                        <button class="notif-tab" data-tab="goals">Goals</button>
                        <button class="notif-tab" data-tab="budget">Budget</button>
                    </div>
                    <div id="notifList" class="notif-list"></div>
                    <div class="notif-footer">
                        <a class="notif-view-all" th:href="@{/notifications}" href="/notifications">View all notifications</a>
                    </div>
                </div>
            </div>

            <div class="topbar__avatar" id="topbarAvatar" th:text="${initials}">U</div>
        </div>
    </header>

    <!-- PAGE HEADER -->
    <div class="page-header">
        <h1 class="page-title">Goals</h1>
        <button class="btn-add" id="openModalBtn">
            <i class="fa-solid fa-plus"></i> Add Goal
        </button>
    </div>

    <!-- SUMMARY CARDS -->
    <section class="summary-grid">
        <div class="summary-card">
            <p class="summary-card__label">Active Goals</p>
            <p class="summary-card__value" id="activeGoalsCount">0</p>
        </div>
        <div class="summary-card">
            <p class="summary-card__label">Total Saved</p>
            <p class="summary-card__value summary-card__value--green" id="totalSaved">$0</p>
        </div>
        <div class="summary-card">
            <p class="summary-card__label">Target Amount</p>
            <p class="summary-card__value" id="targetAmountSummary">$0</p>
        </div>
    </section>

    <!-- GOALS GRID -->
    <section class="goals-grid" id="goalsGrid"></section>

    <div class="empty-state" id="emptyState" style="display:none;">
        <i class="fa-solid fa-flag"></i>
        <p>No goals yet. Start by adding your first goal!</p>
    </div>

</main>

<!-- ═══════════════════════════ ADD / EDIT MODAL ═══════════════════════════ -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal__header">
            <h2 class="modal__title" id="modalTitle">Add New Goal</h2>
            <button class="modal__close" id="closeModalBtn" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form class="modal__form" id="goalForm" novalidate>

            <!-- Hidden state fields -->
            <input type="hidden" id="goalId"/>
            <input type="hidden" id="selectedIcon" value="fa-bullseye"/>
            <input type="hidden" id="selectedColor" value="green"/>

            <!-- Goal Name -->
            <div class="form-row">
                <label for="goalName">Goal Name</label>
                <input type="text" id="goalName" placeholder="e.g. Summer Vacation" required/>
                <span class="form-error" id="nameErr"></span>
            </div>

            <!-- Amount -->
            <div class="form-row">
                <label for="targetAmountInput">Target Amount ($)</label>
                <input type="number" id="targetAmountInput" min="1" placeholder="0" />
            </div>

            <!-- Deadline -->
            <div class="form-row">
                <label for="deadline">Deadline</label>
                <input type="month" id="deadline"/>
            </div>

            <!-- Icon & Color picker -->
            <div class="form-row">
                <label>Icon &amp; Color</label>

                <!-- Color swatches -->
                <div id="colorSwatches" class="color-swatches-row">
                    <button type="button" class="color-swatch" data-color="green" style="background:#16a34a;"></button>
                    <button type="button" class="color-swatch" data-color="blue" style="background:#2563eb;"></button>
                    <button type="button" class="color-swatch" data-color="red" style="background:#dc2626;"></button>
                    <button type="button" class="color-swatch" data-color="yellow" style="background:#ca8a04;"></button>
                    <button type="button" class="color-swatch" data-color="purple" style="background:#7c3aed;"></button>
                    <button type="button" class="color-swatch" data-color="pink" style="background:#db2777;"></button>
                    <button type="button" class="color-swatch" data-color="orange" style="background:#ea580c;"></button>
                    <button type="button" class="color-swatch" data-color="gray" style="background:#4b5563;"></button>
                </div>

                <!-- Icon grid — populated by JS buildIconGrid() -->
                <div id="iconGrid" class="icon-grid-wrap"></div>

                <!-- Manual icon entry -->
                <div class="icon-manual-row">
                    <input type="text" id="iconManualInput" placeholder="e.g. fa-house" class="icon-manual-input"/>
                    <button type="button" id="iconManualApplyBtn" class="icon-manual-btn">Apply</button>
                </div>

                <!-- Live preview -->
                <div class="icon-preview-strip">
                    <div id="iconPreviewWrap" class="icon-preview-wrap">
                        <i id="iconPreviewEl" class="fa-solid fa-bullseye"></i>
                    </div>
                    <div>
                        <p id="iconPreviewLabel" class="icon-preview-name">fa-bullseye</p>
                        <p class="icon-preview-hint">Selected icon</p>
                    </div>
                </div>
            </div>

            <div class="modal__footer">
                <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
                <button type="submit" class="btn-save btn-loadable" id="saveGoalBtn">
                    <span class="btn-label">Save Goal</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>
            </div>
        </form>
    </div>
</div>


<!-- Progress Modal -->
<div class="modal-overlay" id="progressOverlay">
    <div class="modal modal--sm">

        <div class="modal__header">
            <h2 class="modal__title">Add Progress</h2>

            <button class="modal__close"
                    id="closeProgressBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="form-row">
            <label for="progressAmount">
                Amount
            </label>

            <input type="number"
                   id="progressAmount"
                   min="1"
                   placeholder="Enter amount"/>
        </div>

        <div class="modal__footer">
            <button class="btn-cancel"
                    id="cancelProgressBtn">
                Cancel
            </button>

            <button class="btn-save btn-loadable"
                    id="saveProgressBtn">
                <span class="btn-label">Add</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>
        </div>

    </div>
</div>

<!-- ═══════════════════════════ DELETE CONFIRM ═══════════════════════════ -->
<div class="modal-overlay" id="deleteOverlay">
    <div class="modal modal--sm" role="dialog" aria-modal="true">
        <p class="modal__confirm-text">Are you sure you want to delete this goal?</p>
        <div class="modal__footer modal__footer--center">
            <button class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
            <button class="btn-danger btn-loadable" id="confirmDeleteBtn">
                <span class="btn-label">Delete</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script th:src="@{/js/loading.js}" src="../static/js/loading.js"></script>
<script th:src="@{/js/goals.js}" src="../static/js/goals.js"></script>
<script th:src="@{/js/navbar-notifications.js}" src="../static/js/navbar-notifications.js"></script>
</th:block>
</body>
</html>
