<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetWise – Notifications</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}"
      href="../static/css/navbar.css" />

    <link rel="stylesheet" th:href="@{/css/loading.css}"
      href="../static/css/loading.css" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"
      href="../static/css/dashboard.css" />
    <link rel="stylesheet" th:href="@{/css/notification.css}"
      href="../static/css/notification.css" />
  </head>
  <body>

    <!-- ══ PAGE LOADER ══ -->
    <div class="page-loader" id="pageLoader">
      <div class="page-loader__logo">
        <div class="page-loader__icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2" />
            <path d="M2 10h20" />
          </svg>
        </div>
        BudgetWise
      </div>
      <div class="page-loader__bar-track">
        <div class="page-loader__bar-fill" id="loaderBar"></div>
      </div>
      <div class="page-loader__label" id="loaderLabel">Loading your
        dashboard…</div>
    </div>

    <div class="layout">

      <div id="sidebar-root"></div>

      <!-- ══ MAIN ══ -->
      <div class="main">

        <div id="topbar-root"></div>

        <!-- NOTIFICATIONS CONTENT -->
        <div class="notif-page-content">

          <!-- HEADER -->
          <div class="notif-page-header">
            <div>
              <h1>Notifications</h1>
              <p>Stay on top of your budget alerts, goals, and account
                activity.</p>
            </div>

            <div class="notif-page-actions">
              <div class="filter-bar" id="filterBar">
                <button class="filter-btn active"
                  data-filter="all"
                  onclick="setFilter('all')">
                  All
                </button>

                <button class="filter-btn"
                  data-filter="unread"
                  onclick="setFilter('unread')">
                  Unread
                </button>

                <button class="filter-btn"
                  data-filter="BUDGET_ALERT"
                  onclick="setFilter('BUDGET_ALERT')">
                  Budget Alerts
                </button>

                <button class="filter-btn"
                  data-filter="GOAL_REACHED"
                  onclick="setFilter('GOAL_REACHED')">
                  Goals
                </button>
              </div>

              <button class="btn-outline" onclick="markAllRead()">
                <svg viewBox="0 0 24 24"><polyline
                    points="20 6 9 17 4 12" /></svg>
                Mark all read
              </button>

              <button class="btn-danger-outline" onclick="confirmDeleteAll()">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6" /><path
                    d="M19 6l-1 14H6L5 6" /><path d="M10 11v6M14 11v6" /><path
                    d="M9 6V4h6v2" /></svg>
                Clear all
              </button>
            </div>
          </div>

          <!-- STATS -->
          <div class="notif-stats">
            <div class="notif-stat-card">
              <div class="notif-stat-icon" style="background:#eff6ff;">
                <svg viewBox="0 0 24 24" stroke="var(--blue)"><path
                    d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path
                    d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
              </div>
              <div>
                <div class="notif-stat-label">Total</div>
                <div class="notif-stat-val" id="statTotal">—</div>
              </div>
            </div>
          </div>

          <!-- LIST -->
          <div class="notif-page-card" id="notifPageCard">
            <div id="notifPageList">

              <!-- Skeleton 1 -->
              <div class="notif-skeleton">
                <div class="skel-icon"></div>
                <div class="skel-body">
                  <div class="skel-line short"></div>
                  <div class="skel-line long"></div>
                  <div class="skel-line" style="width:30%"></div>
                </div>
              </div>

              <!-- Skeleton 2 -->
              <div class="notif-skeleton">
                <div class="skel-icon"></div>
                <div class="skel-body">
                  <div class="skel-line short"></div>
                  <div class="skel-line long"></div>
                  <div class="skel-line" style="width:30%"></div>
                </div>
              </div>

              <!-- Skeleton 3 -->
              <div class="notif-skeleton">
                <div class="skel-icon"></div>
                <div class="skel-body">
                  <div class="skel-line short"></div>
                  <div class="skel-line long"></div>
                  <div class="skel-line" style="width:30%"></div>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- MODAL -->
    <div id="confirmModal" class="modal-overlay" role="dialog"
      aria-modal="true">
      <div class="modal-box confirm-box">
        <div class="modal-header">
          <h3 class="modal-title">Clear all notifications?</h3>
          <button class="modal-close" onclick="closeConfirmModal()">×</button>
        </div>

        <div class="modal-body">
          <p class="confirm-body">
            This will permanently delete all your notifications.
          </p>

          <div class="confirm-actions">
            <button class="btn-cancel"
              onclick="closeConfirmModal()">Cancel</button>

            <button class="btn-confirm-del btn-loadable" id="confirmDelBtn"
              onclick="deleteAllNotifications()">
              <span class="btn-label">Yes, clear all</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <script th:src="@{/js/loading.js}" src="../static/js/loading.js"></script>
    <script th:src="@{/js/navbar.js}" src="../static/js/navbar.js"></script>
    <script th:src="@{/js/notification.js}"
      src="../static/js/notification.js"></script>
  </body>
</html>
