# Production profile — datasource configured via SPRING_ env vars in DO dashboard
# Set these in DigitalOcean App Platform > Settings > Environment Variables:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host:port/dbname
#   SPRING_DATASOURCE_USERNAME=your_user
#   SPRING_DATASOURCE_PASSWORD=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false