spring.application.name=personal_budget_tracker

# Database — set via environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=86400000

# Admin seed
app.admin.seed.enabled=true
app.admin.email=${ADMIN_EMAIL:admin@budgetwise.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:System Admin}

# Server port (DigitalOcean injects PORT)
server.port=${PORT:8080}